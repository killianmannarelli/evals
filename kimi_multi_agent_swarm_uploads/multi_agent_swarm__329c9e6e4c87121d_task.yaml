prompt: "### DELEGATION WORKFLOW — Cross-Cultural Negotiation Handbook\n\n**Objective:** Coordinate 80 parallel sub-agents, each assigned to one country, to research and write a detailed chapter on negotiation practices. Your role as the coordinator is to orchestrate this large-scale research and writing effort, ensuring consistency and quality before assembling the final 250-page handbook. You must not perform any research yourself; delegate all information gathering via `llm_call`. Your coordinator messages must constitute less than 15% of the total tokens used by the swarm.\n\n#### Phase 1 — Create the Plan\n\n1.  Begin by creating a detailed plan file at `/mnt/agent/output/plan.md` using `str_replace_editor.create`. This file is the master blueprint for all sub-agents. It must include:\n\n    *   **Header:** A clear description of the task: to create a comprehensive handbook on cross-cultural negotiation, with one chapter per country.\n    *   **Assignment Table:** A numbered list of all 80 countries, assigning each to a sub-agent and specifying the output file.\n        ```\n        1.  Japan — cultural norms, legal quirks, case study, do/don't table — result file: result_001.md\n        2.  Brazil — cultural norms, legal quirks, case study, do/don't table — result file: result_002.md\n        ...\n        80. Nigeria — cultural norms, legal quirks, case study, do/don't table — result file: result_080.md\n        ```\n    *   **Output Schema (Chapter Template):** A precise markdown template that every sub-agent must follow. This ensures structural consistency across the final handbook. The template should include sections for cultural context, legal framework, a real-world case study, and a summary table. Crucially, mandate the use of footnotes for all claims and data (e.g., `[1]`, `[2]`) with a corresponding reference list at the end of the chapter.\n    *   **Quality Criteria:** Define what constitutes a `complete` result (all sections populated with substantial content, at least 3-5 citations, case study identified) versus a `partial` result (missing sections, no case study, or insufficient detail).\n\n#### Phase 2 — Parallel Delegation\n\n2.  In a SINGLE message, launch all 80 `llm_call` instances to run concurrently. This parallel execution is the core of the swarm's efficiency.\n\n    Each `llm_call` must be precisely configured:\n    *   **Assignment reference:** \"You are sub-agent N. Your assignment is item N in `/mnt/agent/output/plan.md`. Read the plan carefully to understand the required structure and quality standards.\"\n    *   **Entity scope:** The specific country name you are delegating (e.g., \"Japan\").\n    *   **Output file:** The designated result file, e.g., `/mnt/agent/output/result_{NNN}.md` (zero-padded).\n    *   **fork_mode:** `none`, as each sub-agent's task is self-contained based on the plan.\n    *   **Research instructions:** Direct sub-agents to use the `browse` tool to consult authoritative sources like the World Bank, university publications on international business, diplomatic guides, and reputable news outlets (e.g., The Economist, HBR). Instruct them to search for specific negotiation styles, common business etiquette, contract law basics, and a verifiable negotiation case study (e.g., a major corporate merger or a diplomatic agreement).\n    *   **Result format:** Sub-agents must write their 3-page chapter in markdown to their assigned result file, strictly adhering to the template in the plan. The very first line of the file must be `STATUS: complete` or `STATUS: partial — [reason for incompleteness]`.\n\n#### Phase 3 — Quality Audit & Gap Fill\n\n3.  Once the parallel sub-agent calls complete, perform a quality assurance check.\n    *   Systematically scan the first line of each of the 80 result files to read the `STATUS` line.\n    *   Tally the number of `complete`, `partial`, and missing files. Document the reasons for partial submissions.\n    *   For all `partial` or missing chapters, launch a targeted follow-up wave of `llm_call`s in a single message. Provide these agents with more specific instructions or alternative search queries to fill the identified gaps.\n    *   Randomly sample 5-7 `complete` files and review them for quality, factual accuracy, and proper citation format.\n\n#### Phase 4 — Assemble Final Output\n\n4.  With all chapters collected and quality-checked, assemble the final handbook.\n    *   Read all `result_*.md` files into memory.\n    *   Create the final document at `/mnt/agent/output/final_handbook.md`. Start with a title page, an introduction explaining the handbook's purpose, and a hyperlinked Table of Contents that lists all 80 countries.\n    *   Concatenate the content of each result file in alphabetical order by country. Ensure consistent heading levels and formatting throughout.\n    *   Conclude the handbook with a summary section that includes the completion statistics (e.g., \"80 countries researched, 75 complete, 5 partial\").\n\n#### Resource Budget\n*   **Phase 2 sub-agents:** 80 (one per country)\n*   **Phase 3 follow-ups:** up to 16 (for gaps/partials)\n*   **Sub-agent tools:** browser, str_replace_editor\n*   **Max messages per sub-agent:** 30\n*   **Coordinator critical-path target:** <15% of total swarm tokens\n***CRITICAL***: Please ensure ALL files if you create any are written to \"/app/artifact\" directory"
