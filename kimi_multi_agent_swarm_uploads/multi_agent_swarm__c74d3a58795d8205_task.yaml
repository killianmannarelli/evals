prompt: "### DELEGATION WORKFLOW — GDPR vs 50 State Privacy Laws Comparison\n\n**Objective:** Coordinate 51 parallel sub-agents—one for GDPR and one for each of the 50 US states—to produce a comprehensive analysis of privacy legislation. Each sub-agent will research its assigned jurisdiction and write a detailed chapter. Your role as the coordinator is to orchestrate this research, ensure quality, and assemble the final 220-page compliance guide and matrix. Do NOT perform legal research yourself; delegate all analysis via `llm_call`. Your coordinator messages must be less than 15% of the total swarm token usage.\n\n#### Phase 1 — Create the Plan\n\n1.  Write `/mnt/agent/output/plan.md` using `str_replace_editor.create`. This plan is the single source of truth for all sub-agents. It must contain:\n\n    **Header:** A brief overview of the task, emphasizing the goal of comparing GDPR with US state privacy laws.\n\n    **Assignment Table:** A numbered list of all 51 jurisdictions. The list must be precise:\n    ```\n    1.  GDPR (General Data Protection Regulation) — result file: result_001.md\n    2.  Alabama — result file: result_002.md\n    3.  Alaska — result file: result_003.md\n    ...\n    51. Wyoming — result file: result_051.md\n    ```\n\n    **Output Schema (Chapter Template):** A strict markdown template for each sub-agent's output file. This ensures consistency for the final assembly. Each chapter must include these H2 sections:\n    *   `## Core Definitions`: Key terms like \"Personal Data,\" \"Consumer,\" \"Processing,\" \"Sale,\" and \"Controller/Processor.\"\n    *   `## Consumer Rights`: Detailed explanation of rights such as Access, Deletion, Correction, Opt-Out of Sale/Sharing, and Portability.\n    *   `## Penalties & Enforcement`: Statutory fine amounts, per-violation penalties, and the primary enforcement body (e.g., Attorney General).\n    *   `## Notable Enforcement Actions`: Summaries of 1-2 significant real-world cases or settlements under the law.\n\n    **Quality Criteria:** A `complete` result must fill all four sections with substantive, sourced information. A `partial` result is one missing a section or providing only placeholder content.\n\n#### Phase 2 — Parallel Delegation\n\n2.  Launch ALL 51 sub-agent calls in a SINGLE message. This parallel execution is critical for efficiency. Your coordinator turn will dispatch the entire research swarm at once.\n\n    Each `llm_call` must include:\n    *   **Assignment reference:** \"You are sub-agent N. Read `/mnt/agent/output/plan.md` and find your assigned jurisdiction under item N.\"\n    *   **Entity scope:** The specific law/state to research (e.g., \"GDPR\", \"California (CCPA/CPRA)\").\n    *   **Output file:** `/mnt/agent/output/result_{NNN}.md` (zero-padded).\n    *   **fork_mode:** `none`\n    *   **Research instructions:** \"Use the `browse` tool to find authoritative sources. Search official legislative websites, state Attorney General pages, the IAPP resource center, and reputable legal-tech publications. Synthesize the findings for your assigned jurisdiction.\"\n    *   **Result format:** \"Write your findings into your assigned result file using `str_replace_editor`. The first line of the file MUST be `STATUS: complete` or `STATUS: partial — [reason for incompleteness]`. The content must strictly follow the chapter template defined in `plan.md`.\"\n\n#### Phase 3 — Quality Audit & Gap Fill\n\n3.  Once the sub-agents complete, systematically verify their work. Use `str_replace_editor.view` with a `view_range` of `(0, 1)` to read the `STATUS` line of all 51 result files.\n4.  Tally the number of `complete`, `partial`, and missing files. For any non-complete results, launch a targeted follow-up `llm_call` (in a single batch) with more specific instructions (e.g., \"Focus on finding penalty information for Delaware's privacy law, which was missing in the first attempt.\"). Limit this to one round of follow-ups.\n\n#### Phase 4 — Assemble Final Output\n\n5.  **Assemble the Narrative Guide:** Read all 51 `result_XXX.md` files. Concatenate them into a single document: `/mnt/agent/output/final_guide.md`. Generate a Table of Contents at the top, linking to each jurisdiction's chapter.\n6.  **Create the Compliance Matrix:** This is a crucial step. Create a new file, `/mnt/agent/output/compliance_matrix.tsv`. The first row will be headers: `Jurisdiction`, `Applies To`, `Personal_Data_Definition`, `Right_to_Access`, `Right_to_Delete`, `Opt-Out_of_Sale`, `Max_Civil_Penalty`. Then, for each of the 51 jurisdictions, re-read its corresponding result file and programmatically extract or summarize the key data points to populate one row in the TSV. This provides an at-a-glance comparison.\n7.  **Write the Introduction:** Add a 2-page executive summary to the beginning of `final_guide.md`. This summary should introduce the project, provide a high-level overview of the trends in US privacy law versus the GDPR, and include a metadata section with the completion date and stats (e.g., \"51/51 jurisdictions covered, 48 complete, 3 partial\").\n\n#### Resource Budget\n*   **Phase 2 sub-agents:** 51\n*   **Phase 3 follow-ups:** up to 10\n*   **Sub-agent tools:** `browse`, `str_replace_editor`\n*   **Max messages per sub-agent:** 25\n*   **Coordinator critical-path target:** <15% of total swarm tokens\n***CRITICAL***: Please ensure ALL files if you create any are written to \"/app/artifact\" directory"
