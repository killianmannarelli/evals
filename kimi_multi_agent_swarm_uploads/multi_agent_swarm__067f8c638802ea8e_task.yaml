prompt: "### DELEGATION WORKFLOW — Meta-Analysis of 100 Psychology Replication Studies\n\n**Objective:** Coordinate 100 parallel sub-agents to analyze 100 specific psychology replication studies published between 2015-2025. Your role as coordinator is to plan, delegate, audit, and synthesize the findings into a comprehensive meta-analysis document. Do NOT perform the primary research yourself—every paper analysis must be delegated. Your token usage must be <15% of the swarm's total.\n\n#### Phase 1 — Create the Plan\n\n1.  Your first step is to identify 100 significant replication studies in psychology from the 2015-2025 period. Use the `browse` tool to find curated lists, such as from the Reproducibility Project: Psychology, or by searching databases like Google Scholar for highly cited meta-analyses or special issues on replicability. \n2.  Once you have the list of 100 papers (with titles and DOIs), create a plan file at `/mnt/agent/output/plan.md` using `str_replace_editor.create`. This plan is the blueprint for the entire operation and must contain:\n\n    **Header:** A brief overview of the project, its goal (meta-analysis of replication outcomes), and a description of the final output structure.\n\n    **Assignment Table:** A numbered list of all 100 papers. Each line must assign one paper to a sub-agent.\n    ```\n    1. [Paper Title 1, DOI] — result file: result_001.md\n    2. [Paper Title 2, DOI] — result file: result_002.md\n    ...\n    100. [Paper Title 100, DOI] — result file: result_100.md\n    ```\n\n    **Output Schema:** A strict template for the sub-agent result files. This is critical for the automated synthesis in Phase 4. Each file must contain a YAML frontmatter block for structured data, followed by the narrative summary.\n    ```yaml\n    --- \n    STATUS: complete\n    original_effect_size: [value]\n    original_sample_size: [value]\n    replication_effect_size: [value]\n    replication_sample_size: [value]\n    outcome: [successful_replication / failed_replication]\n    risk_of_bias_score: [1-5]\n    full_citation_apa7: \"[Full APA7 Citation]\"\n    ---\n\n    ## Summary of [Paper Title]\n    \n    ### Original Study Method\n    [...]\n    \n    ### Replication Study Method\n    [...]\n    \n    ### Outcome Analysis\n    [...] \n    ```\n\n    **Quality Criteria:** A 'complete' status requires all YAML fields to be filled and the summary to be at least 500 words. A 'partial' status should be used if a specific data point (e.g., effect size) is not reported in the paper.\n\n#### Phase 2 — Parallel Delegation\n\n3.  In a SINGLE message, launch all 100 `llm_call` invocations. This parallel execution is the core of the swarm strategy.\n\n    Each `llm_call` must specify:\n    - **Assignment reference:** \"You are sub-agent N. Your assigned paper is line N in `/mnt/agent/output/plan.md`.\"\n    - **Entity scope:** The title and DOI of the specific paper.\n    - **Output file:** The corresponding `/mnt/agent/output/result_{NNN}.md`.\n    - **fork_mode:** `none`.\n    - **Research instructions:** \"Use the `browse` tool to find and access the full text of the assigned paper. Read the paper thoroughly to extract the data points required by the plan's YAML schema. Write a detailed 2-page summary covering the methodology and outcomes as specified. Format your entire output precisely according to the schema in `plan.md`.\"\n    - **Result format:** Use `str_replace_editor` to write the full, formatted content to your assigned result file. The `STATUS` line in the YAML block is mandatory.\n\n#### Phase 3 — Quality Audit & Gap Fill\n\n4.  Once the sub-agents complete their work, methodically audit the results. Use `str_replace_editor.view` to read the first 15 lines of each of the 100 result files to check the `STATUS` and YAML data.\n5.  Tally the `complete`, `partial`, and any missing files. For any `partial` results, launch a small batch of follow-up `llm_call`s. These new agents should be given specific instructions to find the missing data points, potentially by searching for secondary sources that analyze the original paper.\n\n#### Phase 4 — Assemble Final Output\n\n6.  **Data Aggregation:** Create a script to read the YAML frontmatter from all 100 `result_XXX.md` files. Consolidate this structured data into a single CSV file named `/mnt/agent/output/meta_analysis_data.csv`. This CSV will be the input for your statistical analysis.\n7.  **Analysis and Visualization:** Use the `python` tool to execute a script that:\n    - Loads `/mnt/agent/output/meta_analysis_data.csv` into a pandas DataFrame.\n    - Performs a meta-analysis on the effect sizes. Use libraries like `metafor` or `pymare` if available, or implement the calculations directly.\n    - Generates a forest plot visualizing the effect sizes and the overall summary effect. Save this plot as `/mnt/agent/output/forest_plot.png`.\n    - Generates a summary table of the risk-of-bias scores and saves it as `/mnt/agent/output/bias_table.md`.\n8.  **Final Document Synthesis:** Use `str_replace_editor` to construct the final 200-page report, `/mnt/agent/output/final_report.md`. Assemble it in this order:\n    - Title page and abstract.\n    - Introduction explaining the replication crisis and the study's methodology.\n    - The risk-of-bias table (`bias_table.md`).\n    - The forest plot image (`forest_plot.png`) with a detailed caption.\n    - A synthesis section discussing the overall findings.\n    - The individual 2-page summaries, concatenated from all 100 result files.\n    - A consolidated, alphabetized APA7 reference list, compiled from the `full_citation_apa7` field of each result file.\n***CRITICAL***: Please ensure ALL files if you create any are written to \"/app/artifact\" directory"
