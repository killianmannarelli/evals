task_id: swarm__micro_pe_rollups__ppp7
primary_decomposition:
- subtask_id: coordinator
  description: 'Coordinator role. Phase 1: write /mnt/agent/output/plan.md containing the task header,
    a numbered assignment table of 75 business niches (one per research sub-agent), the exact output schema
    columns (CompanyOverview, FinancialSnapshot, OwnershipProfile, InvestmentRationale, SourceURLs), and
    quality criteria (complete vs. partial). Phase 2: dispatch all 75 research sub-agents in a single
    message with `fork_mode: none`, each pointing at its zero-padded result file. Phase 3: audit STATUS
    lines via `str_replace_editor.view` with a tiny `view_range`, tally complete/partial/missing, then
    launch up to 15 follow-up sub-agents in one batch (single round). Phase 4: read every complete result_NNN.md,
    assemble /mnt/agent/output/final_report.md with the schema header row, sort by the first schema column,
    and write /mnt/agent/output/summary.md. Coordinator messages must stay under 15% of total swarm tokens.'
  expected_input: Master task prompt for Micro-PE Rollup Targets — top 3 acquisition candidates across
    75 niches (see task.yaml `prompt`).
  expected_output: /mnt/agent/output/plan.md (plan with assignment table + schema + quality criteria);
    /mnt/agent/output/final_report.md (assembled deliverable, schema header + sorted rows); /mnt/agent/output/summary.md
    (tally of complete/partial/missing + brief notes).
  depends_on: []
  is_parallelizable: false
- subtask_id: research_agent_001
  description: 'Research one business niche assigned at line 1 of /mnt/agent/output/plan.md. Use state
    business registries, BuiltWith / Apollo, and local news to find owner-operated SMBs in the niche with
    $1M-$5M EBITDA and an owner 55+; write a CIM-style teaser deck per company with overview, financial
    snapshot, ownership profile, investment rationale, and sources. Write 3 CIM-style teaser decks (one
    per candidate company) to /mnt/agent/output/result_001.md. The first line of the file MUST be `STATUS:
    complete` or `STATUS: partial — [reason]`. Subsequent lines are the data rows; do NOT include the
    schema header in this file (coordinator owns the final header). Hard ceiling: 25 sub-agent messages.'
  expected_input: /mnt/agent/output/plan.md (read line 1 for the business niche assignment + the shared
    output schema and quality criteria).
  expected_output: /mnt/agent/output/result_001.md (STATUS line + 3 CIM-style teaser decks (one per candidate
    company) matching the schema defined in plan.md).
  depends_on:
  - coordinator
  is_parallelizable: true
