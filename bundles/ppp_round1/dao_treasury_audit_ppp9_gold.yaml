task_id: swarm__dao_treasury_audit__ppp9
primary_decomposition:
- subtask_id: coordinator
  description: 'Coordinator role. Phase 1: write /mnt/agent/output/plan.md containing the task header,
    a numbered assignment table of 50 DAOs (one per research sub-agent), the exact output schema columns
    (DAO_Name, Asset_1, Asset_1_Value_USD, Asset_2, Asset_2_Value_USD, Asset_3, Asset_3_Value_USD, Diversification_Non_Stable,
    Custody_Type, Multisig_Address, Signer_Count, Source_Links), and quality criteria (complete vs. partial).
    Phase 2: dispatch all 50 research sub-agents in a single message with `fork_mode: none`, each pointing
    at its zero-padded result file. Phase 3: audit STATUS lines via `str_replace_editor.view` with a tiny
    `view_range`, tally complete/partial/missing, then launch up to 10 follow-up sub-agents in one batch
    (single round). Phase 4: read every complete result_NNN.tsv, assemble /mnt/agent/output/final_dashboard.tsv
    with the schema header row, sort by the first schema column, and write /mnt/agent/output/summary.md.
    Coordinator messages must stay under 15% of total swarm tokens.'
  expected_input: Master task prompt for DAO Treasury Asset Audit — top 3 non-stablecoin assets and custody
    for 50 DAOs (see task.yaml `prompt`).
  expected_output: /mnt/agent/output/plan.md (plan with assignment table + schema + quality criteria);
    /mnt/agent/output/final_dashboard.tsv (assembled deliverable, schema header + sorted rows); /mnt/agent/output/summary.md
    (tally of complete/partial/missing + brief notes).
  depends_on: []
  is_parallelizable: false
- subtask_id: research_agent_001
  description: 'Research one DAO assigned at line 1 of /mnt/agent/output/plan.md. Find the DAO treasury
    address(es) via Etherscan or the relevant block explorer, pull top 3 non-stablecoin holdings + USD
    values, and document custody (Gnosis Safe / multisig signers / signer count) from governance forum
    + Snapshot. Write one TSV row (top 3 assets + custody fields) to /mnt/agent/output/result_001.tsv.
    The first line of the file MUST be `STATUS: complete` or `STATUS: partial — [reason]`. Subsequent
    lines are the data rows; do NOT include the schema header in this file (coordinator owns the final
    header). Hard ceiling: 25 sub-agent messages.'
  expected_input: /mnt/agent/output/plan.md (read line 1 for the DAO assignment + the shared output schema
    and quality criteria).
  expected_output: /mnt/agent/output/result_001.tsv (STATUS line + one TSV row (top 3 assets + custody
    fields) matching the schema defined in plan.md).
  depends_on:
  - coordinator
  is_parallelizable: true
