task_id: swarm__alt_data_vendors__ppp8
primary_decomposition:
- subtask_id: coordinator
  description: 'Coordinator role. Phase 1: write /mnt/agent/output/plan.md containing the task header,
    a numbered assignment table of 65 macro indicators (one per research sub-agent), the exact output
    schema columns (Indicator, VendorName, UpdateFrequency, HistoryDepth, Price, DataSourceURL), and quality
    criteria (complete vs. partial). Phase 2: dispatch all 65 research sub-agents in a single message
    with `fork_mode: none`, each pointing at its zero-padded result file. Phase 3: audit STATUS lines
    via `str_replace_editor.view` with a tiny `view_range`, tally complete/partial/missing, then launch
    up to 15 follow-up sub-agents in one batch (single round). Phase 4: read every complete result_NNN.tsv,
    assemble /mnt/agent/output/final.tsv with the schema header row, sort by the first schema column,
    and write /mnt/agent/output/summary.md. Coordinator messages must stay under 15% of total swarm tokens.'
  expected_input: Master task prompt for Alt-Data Source Catalog — top 3 non-traditional vendors for 65
    macro indicators (see task.yaml `prompt`).
  expected_output: /mnt/agent/output/plan.md (plan with assignment table + schema + quality criteria);
    /mnt/agent/output/final.tsv (assembled deliverable, schema header + sorted rows); /mnt/agent/output/summary.md
    (tally of complete/partial/missing + brief notes).
  depends_on: []
  is_parallelizable: false
- subtask_id: research_agent_001
  description: 'Research one macro indicator assigned at line 1 of /mnt/agent/output/plan.md. For the
    assigned indicator, find 3 non-traditional / alternative data vendors. Use vendor product pages, API
    docs, and pricing pages to fill update frequency, history depth, and price. Write up to 3 vendor rows
    to /mnt/agent/output/result_001.tsv. The first line of the file MUST be `STATUS: complete` or `STATUS:
    partial — [reason]`. Subsequent lines are the data rows; do NOT include the schema header in this
    file (coordinator owns the final header). Hard ceiling: 25 sub-agent messages.'
  expected_input: /mnt/agent/output/plan.md (read line 1 for the macro indicator assignment + the shared
    output schema and quality criteria).
  expected_output: /mnt/agent/output/result_001.tsv (STATUS line + up to 3 vendor rows matching the schema
    defined in plan.md).
  depends_on:
  - coordinator
  is_parallelizable: true
