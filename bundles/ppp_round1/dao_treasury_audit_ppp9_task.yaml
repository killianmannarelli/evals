task_id: swarm__dao_treasury_audit__ppp9
name: DAO Treasury Asset Audit — top 3 non-stablecoin assets and custody for 50 DAOs
domain: swarm_research
difficulty: easy
primary_pattern: map_reduce
coordination_pattern: map_reduce
estimated_sub_agents: 51
has_dependencies: true
sandbox: docker
sandbox_image: swarm-bench-general:latest
simulated_actors: []
tools:
- llm_call
- str_replace_editor
- browse
- read_file
- list_files
- submit_deliverable
time_limit: 5400
prompt: "### DELEGATION WORKFLOW — DAO Treasury Asset Audit\n\n**Objective:** Coordinate 50 parallel sub-agents\
  \ to research the treasury composition and custody setup of 50 major DAOs (Decentralized Autonomous\
  \ Organizations). Your role as coordinator is to plan the research, delegate to sub-agents, audit the\
  \ results, and synthesize the final risk dashboard. Do NOT perform any research yourself; all data gathering\
  \ must be delegated via `llm_call`. Your coordinator messages should constitute less than 15% of the\
  \ total swarm token usage.\n\n#### Phase 1 — Create the Plan\n\n1.  Begin by creating a detailed plan\
  \ file at `/mnt/agent/output/plan.md` using `str_replace_editor.create`. This plan is the single source\
  \ of truth for all sub-agents.\n\n    **Header:** Include a task description, the objective (auditing\
  \ DAO treasuries), and the final output format specification (a TSV file).\n\n    **Assignment Table:**\
  \ Create a numbered list of all 50 DAOs to be investigated. Each line should follow this format:\n \
  \   ```\n    1. [DAO Name] — Find top 3 non-stablecoin assets and custody setup — result file: result_001.tsv\n\
  \    2. [DAO Name] — Find top 3 non-stablecoin assets and custody setup — result file: result_002.tsv\n\
  \    ...\n    50. [DAO Name] — Find top 3 non-stablecoin assets and custody setup — result file: result_050.tsv\n\
  \    ```\n\n    **Output Schema:** Define the exact TSV columns each sub-agent must produce. The required\
  \ headers are: `DAO_Name`, `Asset_1`, `Asset_1_Value_USD`, `Asset_2`, `Asset_2_Value_USD`, `Asset_3`,\
  \ `Asset_3_Value_USD`, `Diversification_Non_Stable`, `Custody_Type`, `Multisig_Address`, `Signer_Count`,\
  \ `Source_Links`.\n\n    **Quality Criteria:** A `complete` result must populate all fields, especially\
  \ the top 3 assets and custody details. A `partial` result is one where custody information (like signer\
  \ count) is unavailable after a thorough search. Specify that sub-agents must use reliable sources.\n\
  \n#### Phase 2 — Parallel Delegation\n\n2.  In a SINGLE message, launch all 50 `llm_call` invocations\
  \ to run in parallel. This concurrent execution is crucial for efficiency.\n\n    Each `llm_call` must\
  \ be precisely configured:\n    *   **Assignment reference:** \"You are sub-agent N. Your task is to\
  \ audit a DAO treasury. Read `/mnt/agent/output/plan.md` and find your assigned DAO under item N.\"\n\
  \    *   **Entity scope:** The specific DAO name (e.g., \"Uniswap DAO\").\n    *   **Output file:**\
  \ `/mnt/agent/output/result_{NNN}.tsv` (zero-padded).\n    *   **fork_mode:** `none`, as each task is\
  \ self-contained based on the plan file.\n    *   **Research instructions:** Instruct the sub-agent\
  \ to use the `browse` tool to investigate its assigned DAO. Key data sources include Etherscan (or other\
  \ block explorers for the relevant chain) for on-chain holdings, the DAO's official governance forum\
  \ for treasury reports and custody discussions, and Snapshot.org pages for governance proposals related\
  \ to treasury management. Example queries: \"[DAO Name] treasury address Etherscan\", \"[DAO Name] multisig\
  \ signers\", \"[DAO Name] treasury diversification report forum\".\n    *   **Result format:** Write\
  \ a single tab-separated value (TSV) row to the assigned result file, matching the columns in the plan's\
  \ Output Schema. The file must begin with a status line: `STATUS: complete` or `STATUS: partial — [reason\
  \ for partial result]`, followed by a newline, and then the TSV data row. Do not include the header\
  \ row in the result file.\n\n#### Phase 3 — Quality Audit & Gap Fill\n\n3.  Once the sub-agents complete\
  \ their work, perform a quality audit. Use `str_replace_editor.view` to read the first line of each\
  \ of the 50 result files.\n    *   Tally the number of `complete`, `partial`, and missing files.\n \
  \   *   For any `partial` or missing results (up to a maximum of 10), launch a targeted follow-up round\
  \ of `llm_call`s in a single message. Provide these agents with more specific search queries or alternative\
  \ data sources to try.\n    *   Randomly spot-check 3-5 `complete` files to ensure data accuracy and\
  \ correct formatting.\n\n#### Phase 4 — Assemble Final Output\n\n4.  Consolidate all successful results\
  \ into the final deliverable. Read the data row from every `complete` and acceptable `partial` result\
  \ file.\n    *   Merge these rows into a single file at `/mnt/agent/output/final_dashboard.tsv`.\n \
  \   *   Write the header row (as defined in the plan) at the top of this file.\n    *   Sort the final\
  \ table alphabetically by `DAO_Name`.\n\n5.  Write a brief summary report in `/mnt/agent/output/summary.md`.\
  \ This report should include:\n    *   Total DAOs audited.\n    *   Completion statistics (complete/partial\
  \ counts).\n    *   A high-level analysis of findings, such as the most commonly held non-stablecoin\
  \ assets across all DAOs, common custody setups (e.g., Gnosis Safe), and average signer counts.\n\n\
  #### Resource Budget\n*   **Phase 2 sub-agents:** 50\n*   **Phase 3 follow-ups:** up to 10\n*   **Sub-agent\
  \ tools:** `browse`, `str_replace_editor`\n*   **Max messages per sub-agent:** 25\n*   **Coordinator\
  \ critical-path target:** <15% of total swarm tokens"
