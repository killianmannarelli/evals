task_id: swarm__state_ai_laws__ppp10
name: State-Level AI Law Tracker — top 3 AI bills per US state since 2023
domain: swarm_research
difficulty: easy
primary_pattern: map_reduce
coordination_pattern: map_reduce
estimated_sub_agents: 51
has_dependencies: true
sandbox: docker
sandbox_image: swarm-bench-general:latest
simulated_actors: []
tools:
- llm_call
- str_replace_editor
- browse
- read_file
- list_files
- submit_deliverable
time_limit: 5400
prompt: "### DELEGATION WORKFLOW — State-Level AI Law Tracker\n\n**Objective:** Coordinate 50 parallel\
  \ sub-agents to research AI-related legislation in each of the 50 US states. Each sub-agent will identify\
  \ up to 3 relevant bills. Your role as the coordinator is to orchestrate this research by planning,\
  \ delegating, and synthesizing the results. You must not perform any research yourself; all data gathering\
  \ is to be delegated via `llm_call`. Your coordinator messages must be less than 15% of the total swarm\
  \ token count.\n\n#### Phase 1 — Create the Plan\n\n1.  Begin by creating a detailed plan file at `/mnt/agent/output/plan.md`\
  \ using `str_replace_editor.create`. This file is the single source of truth for all sub-agents. It\
  \ must include:\n\n    **Header:** A brief description of the task, the overall goal (creating a 50-state\
  \ AI bill tracker), and the final output format.\n\n    **Assignment Table:** A numbered list of all\
  \ 50 US states, assigning one state per sub-agent. The format should be:\n    ```\n    1. Alabama —\
  \ Find top 3 bills mentioning “algorithmic” or “foundation model” since 2023 — result file: result_001.tsv\n\
  \    2. Alaska — Find top 3 bills mentioning “algorithmic” or “foundation model” since 2023 — result\
  \ file: result_002.tsv\n    ...\n    50. Wyoming — Find top 3 bills mentioning “algorithmic” or “foundation\
  \ model” since 2023 — result file: result_050.tsv\n    ```\n\n    **Output Schema:** Define the precise\
  \ TSV (Tab-Separated Values) format for the sub-agent result files. Specify the exact column headers:\n\
  \    `State`, `Bill_ID`, `Title`, `Sponsor`, `Status`, `Summary_of_Obligations`, `Source_URL`\n\n  \
  \  **Quality Criteria:** Define what constitutes a complete result. A sub-agent's work is `complete`\
  \ if it finds at least one bill and populates all columns. If no relevant bills are found after a thorough\
  \ search, the status is also `complete` but the file will contain only the header and a status line.\
  \ A `partial` result is one where a bill is found but critical information (like Status or Sponsor)\
  \ is missing.\n\n#### Phase 2 — Parallel Delegation\n\n2.  In a SINGLE message, launch all 50 `llm_call`\
  \ invocations to run in parallel. This is the core of the swarm strategy, maximizing throughput.\n\n\
  \    Each `llm_call` must be configured as follows:\n    *   **Assignment reference:** \"You are sub-agent\
  \ N. Your task is to research AI legislation. Read `/mnt/agent/output/plan.md` and find your assigned\
  \ state under item N.\"\n    *   **Entity scope:** The specific US state to research (e.g., \"Alabama\"\
  ).\n    *   **Output file:** The corresponding result file, e.g., `/mnt/agent/output/result_001.tsv`.\n\
  \    *   **fork_mode:** `none`. Each sub-agent's task is independent and guided by the central plan.\n\
  \    *   **Research instructions:** Instruct the sub-agent to use the `browse` tool to search Legiscan,\
  \ state legislature websites (e.g., `*.legis.state.us`), and official state government sites. Provide\
  \ example search queries like `\"algorithmic transparency bill [State Name] 2024\"` or `\"site:legiscan.com\
  \ [State Name] 'foundation model'\"`. The search must be restricted to bills proposed or enacted since\
  \ January 1, 2023.\n    *   **Result format:** Instruct the agent to write its findings to the assigned\
  \ result file using `str_replace_editor`. The file's first line MUST be `STATUS: complete` or `STATUS:\
  \ partial — [reason for partial status]`. Subsequent lines must be the TSV data, with columns separated\
  \ by tabs, adhering strictly to the schema in the plan file.\n\n#### Phase 3 — Quality Audit & Gap Fill\n\
  \n3.  Once the sub-agents have completed their tasks, perform a quality check. Use `str_replace_editor.view`\
  \ on each of the 50 result files, reading only the first two lines to check the `STATUS`.\n    *   Tally\
  \ the number of `complete`, `partial`, and missing files.\n    *   For any `partial` or missing results,\
  \ launch a single, consolidated follow-up batch of `llm_call`s. These new agents should be given more\
  \ specific instructions, perhaps suggesting alternative search terms or focusing only on the missing\
  \ data points.\n    *   Limit this to one round of follow-ups to avoid diminishing returns.\n\n####\
  \ Phase 4 — Assemble Final Output\n\n4.  With all individual results gathered, create the final deliverable.\
  \ Read the contents of all `result_*.tsv` files (skipping the STATUS line).\n    *   Merge all data\
  \ into a single file: `/mnt/agent/output/final_bill_tracker.tsv`.\n    *   Ensure the final file has\
  \ a single, consistent header row as defined in the plan.\n    *   Add a new column, `_source_agent_id`,\
  \ to track which sub-agent (e.g., `sub_agent_001`) provided each row of data.\n    *   Sort the final\
  \ table alphabetically by the `State` column.\n\n5.  Write a brief summary report in `/mnt/agent/output/summary.md`.\
  \ This report should include:\n    *   Total states surveyed: 50\n    *   Number of states with complete\
  \ results: [count]\n    *   Number of states with partial/missing results: [count]\n    *   Total number\
  \ of unique bills identified.\n    *   Date of research.\n\n#### Resource Budget\n*   **Phase 2 sub-agents:**\
  \ 50\n*   **Phase 3 follow-ups:** Up to 10\n*   **Sub-agent tools:** `browse`, `str_replace_editor`\n\
  *   **Max messages per sub-agent:** 25\n*   **Coordinator critical-path target:** <15% of total swarm\
  \ tokens"
