# ─────────────────────────────────────────────────────────────────────────────
# eval-pipeline — master config.  TUNE HERE. Nothing below is hardcoded in code.
# ─────────────────────────────────────────────────────────────────────────────

project:
  id: "69f95a0f0992772af7907a03"        # OpenClaw MM Rubrics (mj_blue_shell)
  name: "OpenClaw MM Rubrics"

redash:
  base: "https://redash.scale.com"
  data_source_id: 30                     # _Snowflake (GenAI Ops)
  # API key is read from env REDASH_KEY (never commit it)

sheets:
  # Target spreadsheet for combined output tabs. Service-account creds path in env
  # GOOGLE_SA_JSON (default: <repo>/../creds/sa.json).
  spreadsheet_id: "1Ld547RXFeh91dd4c5eO1XKla2xlHkz0eMVphg1CNwx0"
  tab_prefix: "eval"                     # tabs named "<prefix> <selection> <utc-date>"
  viewer_base: "https://openclaw-viewer-mm.vercel.app/attempt/"

# How tasks are selected for a run. Override on the CLI: --queue L10  OR  --ids file.txt
selection:
  mode: "queue"                          # "queue" | "ids"
  queue:
    review_level: 10                     # -1 attempt · 0 L0 · 10 L10 · 12 L12
    status: "pending"
  ids_file: null                         # path to newline-separated task_ids when mode=ids
  exclude_ids_file: null                 # optional: repo-relative file of task_ids to EXCLUDE
                                         # from the selection (or pass --exclude PATH on the CLI)

models:
  reviewer: "sonnet"                     # CDQ + audit reviewers. Sonnet output is ~5x cheaper than Opus
                                         # (Killian 2026-07-09: cost is the priority, Sonnet OK). Set "opus"
                                         # for maximum depth on a pricier run.
  reviewer_effort: "medium"              # reasoning effort on every reviewer/master/grader agent.
                                         # "medium" = cost-optimized default; "low" is cheaper still;
                                         # "high"/"max" for a deeper (pricier) run.
  orchestrator_note: "master/orchestrator inherits the session model"
  # Grader roles for the drawer audit (per task): each role = one grader agent, then (maybe) 1 master.
  # Tune here:
  #   ["gen1"]                        -> 1 grader (+ CDQ + master-if-flagged)  <-- current
  #   ["gen1","rubric"]               -> adds a dedicated rubric-quality specialist grader
  #   ["gen1","gen2","gen3","rubric"] -> full Hybrid 3+1
  # The single gen1 grader carries the rubric-quality/§9g rigor (folded into its prompt in emit.py).
  audit_grader_roles: ["gen1"]
  # Master (verification) pass over the grader flags: "always" | "if_flagged" | "never".
  #   if_flagged (default, cheapest-that-keeps-a-verify): run the master ONLY when the grader flagged
  #     something; clean tasks get a synthesized Pass master (no extra agent) -> saves the master call
  #     on every clean task. "never" = the single grader IS the verdict (no verify pass, cheapest).
  #     "always" = master on every task (most thorough).
  audit_master: "if_flagged"

cache:
  enabled: true                          # reuse prior LLM verdicts for tasks whose attempt_id is
                                         # unchanged -> skips the expensive LLM (linters still re-run).
                                         # A first run caches nothing; disable per-run with --no-cache.
  file: "cache/audited.json"             # repo-relative store {task_id:{attempt_id,verdict,drawer,...}}

waves:
  # Workflow concurrency is auto-capped; these bound fan-out sizing only.
  cdq_static_batch: 15
  audit_pipeline_batch: 15

# Which checks run. Toggle any off to tune scope. Names map to checks/registry.py.
enabled_checks:
  # deterministic linters (instant, high precision)
  - weight_mix
  - pytest_hardcount
  - visual_sign
  - visual_vs_text
  - overspec_exact
  - answer_key_data
  - negweight_ratio     # §9g negative-weight ratio — the drawer's deterministic Task-level flag
  # LLM checks (Sonnet workflows; the judgment-heavy net)
  - cdq_static          # customer static eval-design QA + blind verify
  - audit_hybrid31      # our Hybrid 3+1 rubric-quality audit vs V10 spec

spec:
  # THE SPEC DOC — the V10 grading rubric (21 dimensions, each with its exact [Fail-]/[Non-Fail-]
  # bands + score options 2/3/5). This IS what the drawer's "Task-level flags" eval grades against
  # (e.g. Overall Rubric Quality - Major/Moderate -> [Fail - 15%+ Moderate Rubric Errors]).
  # Vendored so the pipeline is self-contained; provided by Killian 2026-07-08.
  rubric_csv: "spec/V10_rubric.csv"
  # Appendix: rubric-quality error definitions (major/moderate/minor) + authoring rules (§9g
  # negative-weight ~25% cap 30%) that the CSV references ("See Rubric Quality Definitions in the
  # spec appendix"). Supporting reference for the graders.
  appendix_doc: "spec/authoring_spec.md"
  # Kept for the error-category taxonomy only; the CSV above is authoritative for grading.
  query_id: 304995
  fetch_script: "~/.claude/skills/qc-auditor/scripts/fetch_spec.py"

skill:
  # bundle download/extract — reused unchanged
  prepare_inputs: "~/.claude/skills/customer-data-quality-check/prepare_inputs.py"
  eval_guide: "~/.claude/skills/customer-data-quality-check/references/agentic_quality_eval_guide.md"
  # NOTE: the skill is vendored under eval-pipeline/vendor/ so the pipeline is self-contained;
  # these ~/.claude paths are the fallback if vendor/ is absent.
