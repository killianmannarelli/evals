title: Product in 60 Homes
prompt: "### DELEGATION WORKFLOW — Product in 60 Homes\n\n**Objective:** Coordinate 60 parallel sub-agents to generate photorealistic lifestyle images of a single DTC lamp placed in 60 diverse global household settings. Your role as coordinator is to plan the visual campaign, delegate image generation, and assemble the final asset collection. Do NOT perform any research or image generation yourself—every creative and research task must be delegated via `llm_call`. Your coordinator messages must be <15% of the total swarm token count.\n\n#### Phase 1 — Create the Plan\n\n1.  **Define the Core Asset:** Before planning, analyze the source product. Note its key visual characteristics: shape, material, color, size. This description will be the core of every image generation prompt.\n2.  **Write the Plan File:** Use `str_replace_editor.create` to write `/mnt/agent/output/plan.md`. This plan is the single source of truth for all sub-agents. It must contain:\n\n    *   **Header:** A detailed description\
  \ of the lamp (e.g., \"A 16-inch tall minimalist desk lamp with a conical-shaped matte black metal shade, a thin brass stem, and a round marble base.\"). Also, state the overall goal: to create a diverse set of 60 marketing images.\n    *   **Assignment Table:** A numbered list of 60 distinct household types and locations, one per line. Be creative and specific (e.g., \"1. Tokyo micro-apartment\", \"2. Kenyan farmhouse near Naivasha\", \"3. Brooklyn loft with exposed brick\", \"4. Parisian Haussmann apartment with herringbone floors\", \"5. Modernist glass house in a Brazilian rainforest\"). Each line should map to an output file: `1. [Entity] - result file: result_001.json`\n    *   **Output Schema:** Each sub-agent must produce one image file (e.g., `/mnt/agent/output/images/result_001.png`) and one JSON status file (`/mnt/agent/output/results/result_001.json`). The JSON file must contain the status, the path to the generated image, and the exact `mango` prompt used.\n    *   **Quality\
  \ Criteria:** A complete result requires a high-resolution, photorealistic image where the lamp is clearly visible and unchanged, the environment matches the assigned location, and details like electrical outlets are region-appropriate.\n\n#### Phase 2 — Parallel Delegation\n\n3.  Launch ALL 60 sub-agent calls in a SINGLE message. This parallel execution is critical for efficiency.\n\n    Each `llm_call` must instruct the sub-agent to perform a two-step process:\n\n    *   **Research Step:** \"You are sub-agent N, assigned to the '[Entity Name]' setting. First, use the `browse` tool to research this environment. Find images and descriptions of the typical architecture, interior design, color palettes, and electrical outlets (e.g., 'what electrical socket is used in Kenya'). Synthesize these details into a descriptive paragraph.\"\n    *   **Generation Step:** \"Next, construct a detailed prompt for the `mango` tool. This prompt must combine the core lamp description from `plan.md` with\
  \ the environmental details you just researched. The prompt should be a single, cohesive paragraph describing a complete scene. Example: 'Photorealistic lifestyle photo of a [lamp description] on a rustic wooden desk inside a Kenyan farmhouse. Sunlight streams through a window, illuminating dust motes. The background shows handcrafted furniture and local textiles. The lamp is plugged into a British-style Type G socket on the wall.'\"\n    *   **Execution & Reporting:** Instruct the agent to call `mango` with the crafted prompt, saving the output to `/mnt/agent/output/images/result_{NNN}.png`. Then, use `str_replace_editor` to write the status file `/mnt/agent/output/results/result_{NNN}.json` containing `{\"status\": \"complete\", \"image_path\": \"/mnt/agent/output/images/result_{NNN}.png\", \"prompt_used\": \"...\"}`. If generation fails, the status should be `partial` with an error reason.\n\n#### Phase 3 — Quality Audit & Gap Fill\n\n4.  After the parallel jobs complete, systematically\
  \ check the output. Use `bash` or `str_replace_editor` to list files in `/mnt/agent/output/results/` and read the status from each JSON file.\n5.  Tally the `complete`, `partial`, and missing results. For up to 10 failed or low-quality generations, launch a single follow-up batch of `llm_call`s. For these, provide refined instructions, such as simplifying the prompt or suggesting a different angle (e.g., \"Focus on a close-up shot of the lamp on a surface, with the background blurred.\").\n\n#### Phase 4 — Assemble Final Output\n\n6.  Consolidate all successful results into a final asset manifest. Read all the `result_NNN.json` files and compile them into a single `/mnt/agent/output/pdp_carousel_manifest.json`.\n7.  This manifest should be an array of objects, where each object contains the location, the path to the generated image, and the prompt used. This JSON file is the final deliverable, ready to power a dynamic product-page image carousel.\n8.  Write a brief `/mnt/agent/output/summary.md`\
  \ report detailing the project's success: total images generated, list of all locations covered, and a list of any locations that failed generation.\n\n#### Resource Budget\n- **Phase 2 sub-agents:** 60 (one per household type)\n- **Phase 3 follow-ups:** up to 10 (for failures)\n- **Sub-agent tools:** browse, mango, str_replace_editor\n- **Coordinator critical-path target:** <15% of total swarm tokens\n***CRITICAL***: Please ensure ALL files if you create any are written to \"/app/artifact\" directory"
