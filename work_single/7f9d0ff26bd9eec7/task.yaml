prompt: "### DELEGATION WORKFLOW — Sneaker Drop: Global Edition\n\n**Objective:** Coordinate 45 parallel sub-agents to generate unique, localized campaign visuals for a new sneaker. Each sub-agent is assigned one of 45 global cities. Your role as coordinator is to plan the campaign, delegate image generation, audit completion, and assemble the final web assets. Do NOT generate images yourself — every creative task must be delegated via `llm_call`. Target: your coordinator messages should be <15% of total assistant tokens across the swarm.\n\n#### Phase 1 — Create the Plan\n\n1. Write `/mnt/agent/output/plan.md` using `str_replace_editor.create`. This plan is the single source of truth for all sub-agents. It must contain:\n\n   **Header:** A detailed description of the task and the sneaker. This is critical for product consistency. Describe the sneaker from the seed 3D model in detail: colorway, materials (e.g., 'white leather upper with suede overlays'), sole design, unique features (e.g., 'translucent heel tab').\n\n   **Assignment Table:** A numbered list of all 45 sneakerhead cities, one per line. This maps each sub-agent ID to a location.\n   ```\n   1. Tokyo, Japan — generate key visual — result file: result_001\n   2. New York City, USA — generate key visual — result file: result_002\n   ...\n   45. Berlin, Germany — generate key visual — result file: result_045\n   ```\n\n   **Output Schema:** Each sub-agent must produce two files: `result_{NNN}.jpg` (the 16:9 image) and `result_{NNN}.txt` (a status file).\n\n   **Quality & Style Criteria:** Define the creative direction. The image should be 'editorial fashion photography' style. It must feature a person ('local influencer') wearing the sneakers. The background must evoke the assigned city, incorporating elements like iconic architecture, public transit, or local street art styles. The overall mood should be 'hype' and 'exclusive'.\n\n#### Phase 2 — Parallel Delegation\n\n2. Launch ALL 45 sub-agent calls in a SINGLE message. This parallel execution is essential for efficiency.\n\n   Each `llm_call` must instruct the sub-agent to perform a two-step process:\n   - **Assignment reference:** \"You are sub-agent N. Read `/mnt/agent/output/plan.md`, find your assigned city under item N.\"\n   - **Entity scope:** The specific city to generate a visual for.\n   - **Output file:** The base name for the output, e.g., `/mnt/agent/output/result_{NNN}`.\n   - **fork_mode:** `none`\n   - **Generation Instructions:** Instruct the agent to use its creativity to craft a detailed prompt for the `mango` tool based on the plan. This prompt must synthesize: a) the detailed sneaker description, b) the assigned city's vibe, c) the influencer and styling, and d) the overall photographic style. Then, it must execute `mango` to generate the image, saving it as `result_{NNN}.jpg`.\n   - **Result Format:** After saving the image, the sub-agent must use `str_replace_editor` to create `result_{NNN}.txt` containing two lines: the status (`STATUS: complete`) and the exact `mango` prompt used. This is for auditing and reproducibility.\n\n   CRITICAL: All 45 `llm_call` invocations must be in the same message to leverage parallel processing.\n\n#### Phase 3 — Quality Audit & Gap Fill\n\n3. Once the sub-agents complete, verify their output. You cannot 'see' the images, but you can check for their existence and metadata.\n   - Use `bash` or `str_replace_editor` to list all `result_*.txt` and `result_*.jpg` files.\n   - For each of the 45 assignments, confirm that both the `.txt` and `.jpg` files exist and are non-empty.\n   - Read the `STATUS` line from each `.txt` file.\n   - Count `complete` vs. missing assignments.\n   - For any missing pairs of files, launch a single batch of follow-up `llm_call`s to regenerate them. Limit this to one follow-up round.\n\n#### Phase 4 — Assemble Final Output\n\n4. Your final task is to build the set of region-locked landing pages. This will be a collection of simple HTML files.\n   - Create a main `index.html` file that serves as a portal, with a list of links to each city page (e.g., \"View the Tokyo Campaign\").\n   - For each of the 45 cities, generate a corresponding `[city_name].html` file (e.g., `tokyo.html`).\n   - Each city page should have a title (e.g., \"[Sneaker Name] - Tokyo Drop\") and embed the corresponding image (`<img src=\"result_{NNN}.jpg\" ...>`).\n   - Use `str_replace_editor` to create all 46 HTML files (`index.html` + 45 city pages) in `/mnt/agent/output/`.\n   - Write a final `summary.md` file detailing the project's completion: total images generated, number of successful pages created, and a list of any cities that failed.\n\n#### Resource Budget\n- **Phase 2 sub-agents:** 45 (one per city)\n- **Phase 3 follow-ups:** up to 10 (for gaps/failures)\n- **Sub-agent tools:** mango, str_replace_editor\n- **Max messages per sub-agent:** 10\n- **Coordinator critical-path target:** <15% of total swarm tokens\n***CRITICAL***: Please ensure ALL files if you create any are written to \"/app/artifact\" directory"
